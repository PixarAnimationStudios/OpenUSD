[build-system]
requires = [
    "setuptools>=69",
    "tomli; python_version < '3.11'",
    "wheel",
]
build-backend = "openusd_pep517.backend"
backend-path = ["."]

[project]
name = "usd-imaging"
dynamic = ["version"]
description = "OpenUSD Hydra and imaging runtime"
readme = "README.md"
requires-python = ">=3.9, <3.15"
license = { text = "LicenseRef-TOST-1.0" }
authors = [
    { name = "Pixar Animation Studios", email = "openusd+usd_pypi@pixar.com" },
]
dependencies = [
    "usd-core=={openusd_version}",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Environment :: Console",
    "Topic :: Multimedia :: Graphics",
]

[project.urls]
Documentation = "https://openusd.org"
"Developer Docs" = "https://www.openusd.org/release/apiDocs.html"
Source = "https://github.com/PixarAnimationStudios/OpenUSD"
"Discussion Group" = "https://forum.openusd.org"

[tool.openusd-packaging.build]
args = [
    "--build-args",
    "USD,-DPXR_BUILD_USD_TOOLS=OFF -DPXR_BUILD_EXEC=OFF -DPXR_INSTALL_LOCATION=../pxr/pluginfo",
    "--no-materialx",
    "--no-examples",
    "--no-tutorials",
    "--no-usdview",
]
windows-extra-args = [
    "--build-args",
    "USD,-DPXR_ENABLE_PRECOMPILED_HEADERS=OFF",
]

[tool.openusd-packaging.manifest]
include = [
    "lib/python/pxr/CameraUtil/**",
    "lib/python/pxr/GeomUtil/**",
    "lib/python/pxr/Glf/**",
    "lib/python/pxr/PxOsd/**",
    "lib/python/pxr/SdrGlslfx/**",
    "lib/python/pxr/UsdAppUtils/**",
    "lib/python/pxr/UsdImagingGL/**",
    "lib/python/pxr/pluginfo/glf/**",
    "lib/python/pxr/pluginfo/hd/**",
    "lib/python/pxr/pluginfo/hdGp/**",
    "lib/python/pxr/pluginfo/hdsi/**",
    "lib/python/pxr/pluginfo/hdSt/**",
    "lib/python/pxr/pluginfo/hdx/**",
    "lib/python/pxr/pluginfo/hgiGL/**",
    "lib/python/pxr/pluginfo/hgiMetal/**",
    "lib/python/pxr/pluginfo/hgiVulkan/**",
    "lib/python/pxr/pluginfo/hio/**",
    "lib/python/pxr/pluginfo/hioAvif/**",
    "lib/python/pxr/pluginfo/hioImageIO/**",
    "lib/python/pxr/pluginfo/hioOiio/**",
    "lib/python/pxr/pluginfo/hioOpenEXR/**",
    "lib/python/pxr/pluginfo/hioOpenVDB/**",
    "lib/python/pxr/pluginfo/sdrGlslfx/**",
    "lib/python/pxr/pluginfo/usdAppUtils/**",
    "lib/python/pxr/pluginfo/usdImaging/**",
    "lib/python/pxr/pluginfo/usdImagingGL/**",
    "lib/python/pxr/pluginfo/usdProcImaging/**",
    "lib/python/pxr/pluginfo/usdRiPxrImaging/**",
    "lib/python/pxr/pluginfo/usdSkelImaging/**",
    "lib/python/pxr/pluginfo/usdVolImaging/**",
    "lib/libcameraUtil*",
    "lib/libgarch*",
    "lib/libgeomUtil*",
    "lib/libglf*",
    "lib/libhd*",
    "lib/libhf*",
    "lib/libhgi*",
    "lib/libhio*",
    "lib/libpxOsd*",
    "lib/libsdrGlslfx*",
    "lib/libusdAppUtils*",
    "lib/libusdImaging*",
    "plugin/usd/hdStorm/*",
    "plugin/usd/hdEmbree/*",
    "plugin/usd/hioAvif/*",
    "plugin/usd/hioImageIO/*",
    "plugin/usd/hioOiio/*",
    "plugin/usd/hioOpenEXR/*",
]
