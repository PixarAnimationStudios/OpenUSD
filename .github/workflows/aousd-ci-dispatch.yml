name: Dispatch AOUSD BuildUSD

on:
  push:
    branches:
      - build-ig
      - dev
    tags:
      - 'v[0-9][0-9].[0-9][0-9]'
  pull_request_target:
    branches:
      - build-ig
      - dev
    types:
      - opened
      - ready_for_review
      - reopened
      - synchronize

permissions:
  contents: read

jobs:
  dispatch:
    if: ${{ github.event_name == 'push' || !github.event.pull_request.draft }}
    runs-on: ubuntu-22.04
    steps:
      - name: Create CI dispatcher token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 #v2
        with:
          app-id: ${{ vars.AOUSD_CI_APP_ID }}
          private-key: ${{ secrets.AOUSD_CI_APP_PRIVATE_KEY }}
          owner: ${{ vars.AOUSD_CI_REPOSITORY_OWNER }}
          repositories: ${{ vars.AOUSD_CI_REPOSITORY_NAME }}
          permission-actions: write
      - name: Dispatch BuildUSD
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd #v8
        env:
          AOUSD_CI_REPOSITORY_NAME: ${{ vars.AOUSD_CI_REPOSITORY_NAME }}
          AOUSD_CI_REPOSITORY_OWNER: ${{ vars.AOUSD_CI_REPOSITORY_OWNER }}
          AOUSD_CI_WORKFLOW: buildusd.yml
          AOUSD_CI_WORKFLOW_REF: aousd-ci-cd-ct
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const isPullRequest = context.eventName === "pull_request_target";
            const pullRequest = context.payload.pull_request;
            const sourceSha = isPullRequest
              ? pullRequest.merge_commit_sha
              : context.payload.after;
            const sourceRef = isPullRequest
              ? `refs/pull/${pullRequest.number}/merge`
              : context.payload.ref;
            if (!sourceSha) {
              core.setFailed("GitHub did not provide a source commit to test");
              return;
            }
            const inputs = {
              source_event_name: isPullRequest ? "pull_request" : "push",
              source_ref: sourceRef,
              source_repository: context.payload.repository.full_name,
              source_sha: sourceSha,
            };
            if (isPullRequest) {
              inputs.pull_request = pullRequest.number;
              inputs.source_base_ref = pullRequest.base.ref;
            }
            await github.rest.actions.createWorkflowDispatch({
              owner: process.env.AOUSD_CI_REPOSITORY_OWNER,
              repo: process.env.AOUSD_CI_REPOSITORY_NAME,
              workflow_id: process.env.AOUSD_CI_WORKFLOW,
              ref: process.env.AOUSD_CI_WORKFLOW_REF,
              inputs,
            });
